<div class="confirm-overlay" (click)="onOverlayClick()"></div>
<div class="confirm-modal" [class]="'confirm-modal confirm-modal--' + variant()">
  <!-- Icon -->
  <div class="confirm-icon-wrapper">
    @if (variant() === 'danger') {
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="confirm-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="confirm-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
      </svg>
    }
  </div>

  <!-- Text -->
  <h3 class="confirm-title">{{ title() }}</h3>
  <p class="confirm-message">{{ message() }}</p>

  <!-- Actions -->
  <div class="confirm-actions">
    <button
      class="confirm-btn confirm-btn--cancel"
      (click)="cancelled.emit()"
      [disabled]="loading()">
      {{ cancelLabel() }}
    </button>
    <button
      class="confirm-btn confirm-btn--confirm"
      (click)="confirmed.emit()"
      [disabled]="loading()">
      @if (loading()) {
        <span class="confirm-spinner"></span>
      }
      {{ confirmLabel() }}
    </button>
  </div>
</div>
