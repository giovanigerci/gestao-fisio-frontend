<div class="form-page">
  <!-- Header -->
  <div class="form-header">
    <button (click)="cancelar()" aria-label="Voltar" class="form-back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        class="form-back-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
    </button>
    <h1 class="form-title">
      {{ modoEdicao() ? 'Editar Clínica' : 'Nova Clínica' }}
    </h1>
  </div>

  <!-- Loading -->
  @if (carregando()) {
  <div class="form-loading">
    <div class="form-spinner"></div>
  </div>
  }

  <!-- Form -->
  @if (!carregando()) {
  <form (submit)="$event.preventDefault(); salvar()" class="form-container">

    <!-- Error -->
    @if (erro()) {
    <div class="form-alert form-alert--error">
      <p>{{ erro() }}</p>
    </div>
    }

    <!-- Nome -->
    <div>
      <label class="form-label">Nome <span class="form-required">*</span></label>
      <input [value]="nome()" (input)="nome.set($any($event.target).value)" class="input-field"
        placeholder="Nome da clínica" />
    </div>

    <!-- Endereço -->
    <div>
      <label class="form-label">Endereço <span class="form-required">*</span></label>
      <input [value]="endereco()" (input)="endereco.set($any($event.target).value)" class="input-field"
        placeholder="Rua, número, bairro, cidade..." />
    </div>

    <!-- Telefone -->
    <div>
      <label class="form-label">Telefone</label>
      <input type="tel" [appTelefoneMask]="telefone()" (valorLimpo)="telefone.set($event)" class="input-field"
        placeholder="(00) 00000-0000" />
    </div>

    <!-- Valor por atendimento -->
    <div>
      <label class="form-label">Valor por atendimento <span class="form-required">*</span></label>
      <input type="text" inputmode="decimal" [value]="valorPorAtendimento()"
        (input)="valorPorAtendimento.set($any($event.target).value)" class="input-field" placeholder="40.00" />
    </div>

    <!-- Ativo -->
    <div class="form-toggle-row">
      <label class="form-label" style="margin-bottom: 0">Clínica ativa</label>
      <button type="button" (click)="toggleAtivo()" class="toggle-track cursor-pointer" [class.active]="ativo()">
        <div class="toggle-thumb"></div>
      </button>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" (click)="cancelar()" class="form-btn form-btn--cancel">
        Cancelar
      </button>
      <button type="submit" [disabled]="salvando()" class="form-btn form-btn--submit">
        @if (salvando()) {
        <span class="form-btn-loading">
          <span class="form-btn-spinner"></span>
          Salvando...
        </span>
        } @else {
        Salvar
        }
      </button>
    </div>
  </form>
  }
</div>
