<div class="login-page">
  <!-- Background Glows -->
  <div class="login-bg-glow login-bg-glow--top"></div>
  <div class="login-bg-glow login-bg-glow--bottom"></div>

  <div class="login-container">

    <!-- Brand -->
    <div class="login-brand">
      <div class="login-brand__icon">
        <img src="/logo.png" alt="Gestão Fisio Logo" style="width: 48px; height: 48px; object-fit: contain;" />
      </div>
      <h1 class="login-brand__title">
        <span style="color: var(--color-primary);">Gestão</span> <span style="color: var(--color-accent);">Fisio</span>
      </h1>
      <p class="login-brand__subtitle">Gestão inteligente para sua prática clínica</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <form (submit)="$event.preventDefault(); entrar()" class="login-form">

        <!-- Username -->
        <div class="form-field">
          <label for="login-username" class="form-field__label">USUÁRIO</label>
          <div class="form-field__input-wrapper">
            <svg class="form-field__icon" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input id="login-username" type="text" autocomplete="username" placeholder="Seu nome de usuário"
              [value]="username()" (input)="username.set($any($event.target).value)"
              class="form-field__input" />
          </div>
        </div>

        <!-- Password -->
        <div class="form-field">
          <label for="login-password" class="form-field__label">SENHA</label>
          <div class="form-field__input-wrapper">
            <svg class="form-field__icon" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input id="login-password" [type]="mostrarSenha() ? 'text' : 'password'" autocomplete="current-password"
              placeholder="Sua senha" [value]="password()" (input)="password.set($any($event.target).value)"
              class="form-field__input form-field__input--has-toggle" />
            <button type="button" (click)="alternarVisibilidadeSenha()"
              [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
              class="form-field__toggle">
              @if (mostrarSenha()) {
              <svg class="form-field__toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
              } @else {
              <svg class="form-field__toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              }
            </button>
          </div>
        </div>

        <!-- Manter Conectado -->
        <div class="login-toggle-row" (click)="manterConectado.set(!manterConectado())">
          <span class="login-toggle-label">Manter conectado</span>
          <div class="toggle-track" [class.active]="manterConectado()">
            <div class="toggle-thumb"></div>
          </div>
        </div>

        <!-- Success Message -->
        @if (mensagemSucesso()) {
        <div class="login-success">
          <svg class="login-success__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
          <span>{{ mensagemSucesso() }}</span>
        </div>
        }

        <!-- Error -->
        @if (erro()) {
        <div class="login-error">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="15" y1="9" x2="9" y2="15" />
            <line x1="9" y1="9" x2="15" y2="15" />
          </svg>
          <span>{{ erro() }}</span>
        </div>
        }

        <!-- Submit -->
        <button type="submit" [disabled]="carregando()"
          class="login-btn" [class.login-btn--loading]="carregando()">
          @if (carregando()) {
          <span class="login-btn__spinner"></span>
          <span>Entrando...</span>
          } @else {
          <span>Entrar</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
          }
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <a routerLink="/registrar" class="login-link">Criar conta</a>
    </div>
  </div>
</div>
