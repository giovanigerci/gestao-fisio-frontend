<div class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden" style="background: #0a0f1a;">
  <!-- Background Glows -->
  <div
    class="absolute w-[500px] h-[500px] rounded-full blur-[120px] opacity-30 animate-[float-slow_8s_ease-in-out_infinite_alternate]"
    style="top: -160px; right: -120px; background: radial-gradient(circle, #5383A3, transparent 70%);">
  </div>
  <div
    class="absolute w-[400px] h-[400px] rounded-full blur-[120px] opacity-25 animate-[float-slow_10s_ease-in-out_infinite_alternate-reverse]"
    style="bottom: -120px; left: -100px; background: radial-gradient(circle, #C9A888, transparent 70%);">
  </div>

  <div class="w-full max-w-sm relative z-10 flex flex-col items-center gap-8 animate-[fadeInUp_0.5s_ease-out]">

    <!-- Brand -->
    <div class="flex flex-col items-center gap-3 text-center">
      <!-- Brand Logo -->
      <div
        class="relative group flex items-center justify-center w-24 h-24 rounded-3xl border border-primary/25 shadow-xl shadow-primary/20 bg-slate-900/40 backdrop-blur-md animate-[pulse-glow_3s_ease-in-out_infinite]">
        <img src="/logo.png" alt="Gestão Fisio Logo"
          class="w-18 h-18 object-contain group-hover:scale-105 transition-all duration-300" />
      </div>

      <h1 class="text-3xl md:text-4xl font-bold tracking-tight">
        <span class="text-primary">Gestão</span> <span class="text-accent">Fisio</span>
      </h1>
      <p class="text-slate-400 text-sm">Gestão inteligente para sua prática clínica</p>
    </div>

    <!-- Login Card -->
    <div class="w-full p-7 md:p-9 rounded-3xl border border-slate-700/30"
      style="background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 4px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);">

      <form (submit)="$event.preventDefault(); entrar()" class="flex flex-col gap-5">

        <!-- Username -->
        <div class="flex flex-col gap-1.5">
          <label for="login-username" class="text-xs font-medium text-slate-400 tracking-wide">USUÁRIO</label>
          <div class="relative flex items-center">
            <svg class="absolute left-3.5 w-[18px] h-[18px] text-slate-500 pointer-events-none" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input id="login-username" type="text" autocomplete="username" placeholder="Seu nome de usuário"
              [value]="username()" (input)="username.set($any($event.target).value)" class="w-full pl-11 pr-4 py-3 rounded-xl text-sm text-slate-100 placeholder:text-slate-500
                     border border-slate-700/50 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none
                     transition-all duration-150"
              style="background: #0f172a; font-family: 'Inter', system-ui, sans-serif;" />
          </div>
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-1.5">
          <label for="login-password" class="text-xs font-medium text-slate-400 tracking-wide">SENHA</label>
          <div class="relative flex items-center">
            <svg class="absolute left-3.5 w-[18px] h-[18px] text-slate-500 pointer-events-none" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input id="login-password" [type]="mostrarSenha() ? 'text' : 'password'" autocomplete="current-password"
              placeholder="Sua senha" [value]="password()" (input)="password.set($any($event.target).value)" class="w-full pl-11 pr-12 py-3 rounded-xl text-sm text-slate-100 placeholder:text-slate-500
                     border border-slate-700/50 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none
                     transition-all duration-150"
              style="background: #0f172a; font-family: 'Inter', system-ui, sans-serif;" />
            <button type="button" (click)="alternarVisibilidadeSenha()"
              [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
              class="absolute right-2.5 w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 hover:text-slate-300 hover:bg-white/5 transition-all cursor-pointer">
              @if (mostrarSenha()) {
              <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
              } @else {
              <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              }
            </button>
          </div>
        </div>

        <!-- Error -->
        @if (erro()) {
        <div
          class="flex items-center gap-2 px-4 py-3 rounded-xl border border-red-500/20 text-red-400 text-sm font-medium animate-[fadeIn_0.25s_ease-out]"
          style="background: rgba(248, 113, 113, 0.08);">
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="15" y1="9" x2="9" y2="15" />
            <line x1="9" y1="9" x2="15" y2="15" />
          </svg>
          <span>{{ erro() }}</span>
        </div>
        }

        <!-- Submit -->
        <button type="submit" [disabled]="carregando()" class="mt-1 w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-primary text-white text-sm font-semibold
                 hover:brightness-110 hover:-translate-y-0.5 active:translate-y-0
                 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0
                 transition-all duration-150 cursor-pointer" [style.box-shadow]="'0 0 16px rgba(83, 131, 163, 0.25)'">
          @if (carregando()) {
          <span
            class="w-[18px] h-[18px] border-2 border-white/30 border-t-white rounded-full animate-spin inline-block"></span>
          <span>Entrando...</span>
          } @else {
          <span>Entrar</span>
          <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
          }
        </button>
      </form>
    </div>

    <!-- Footer -->
    <p class="text-xs text-slate-600">Gestão Fisio &middot; v1.0</p>
  </div>
</div>
