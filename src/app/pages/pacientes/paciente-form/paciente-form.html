<div class="min-h-screen px-4 pt-6 pb-8">
  <!-- Header -->
  <div class="flex items-center gap-3 mb-8">
    <button (click)="cancelar()"
      class="w-10 h-10 rounded-lg flex items-center justify-center text-[var(--color-text-secondary)]
                   hover:text-[var(--color-text-primary)] hover:bg-[var(--color-surface-hover)] transition-colors cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
    </button>
    <h1 class="text-xl font-semibold text-[var(--color-text-primary)]">
      {{ modoEdicao() ? 'Editar Paciente' : 'Novo Paciente' }}
    </h1>
  </div>

  <!-- Loading -->
  @if (carregando()) {
  <div class="flex items-center justify-center py-20">
    <div class="w-8 h-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div>
  </div>
  }

  <!-- Form -->
  @if (!carregando()) {
  <form (submit)="$event.preventDefault(); salvar()" class="flex flex-col gap-5 max-w-lg lg:mx-auto">

    <!-- Error -->
    @if (erro()) {
    <div class="bg-[var(--color-danger)]/10 border border-[var(--color-danger)]/20 rounded-xl p-4 animate-in">
      <p class="text-[var(--color-danger)] text-sm">{{ erro() }}</p>
    </div>
    }

    <!-- Nome -->
    <div>
      <label class="block text-sm text-[var(--color-text-primary)] mb-1.5">Nome <span
          class="text-[var(--color-danger)]">*</span></label>
      <input [value]="nome()" (input)="nome.set($any($event.target).value)" class="input-field"
        placeholder="Nome completo" />
    </div>

    <!-- CPF -->
    <div>
      <label class="block text-sm text-[var(--color-text-primary)] mb-1.5">CPF <span
          class="text-[var(--color-danger)]">*</span></label>
      <input [value]="cpf()" (input)="cpf.set($any($event.target).value)" class="input-field"
        placeholder="000.000.000-00" />
    </div>

    <!-- Telefone -->
    <div>
      <label class="block text-sm text-[var(--color-text-primary)] mb-1.5">Telefone <span
          class="text-[var(--color-danger)]">*</span></label>
      <input [value]="telefone()" (input)="telefone.set($any($event.target).value)" class="input-field"
        placeholder="(00) 00000-0000" />
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm text-[var(--color-text-primary)] mb-1.5">E-mail</label>
      <input type="email" [value]="email()" (input)="email.set($any($event.target).value)" class="input-field"
        placeholder="email@exemplo.com" />
    </div>

    <!-- Data de nascimento -->
    <div>
      <label class="block text-sm text-[var(--color-text-primary)] mb-1.5">Data de nascimento</label>
      <input type="date" [value]="dataNascimento()" (input)="dataNascimento.set($any($event.target).value)"
        class="input-field" />
    </div>

    <!-- Endereço -->
    <div>
      <label class="block text-sm text-[var(--color-text-primary)] mb-1.5">Endereço</label>
      <input [value]="endereco()" (input)="endereco.set($any($event.target).value)" class="input-field"
        placeholder="Rua, número, bairro..." />
    </div>

    <!-- Histórico médico -->
    <div>
      <label class="block text-sm text-[var(--color-text-primary)] mb-1.5">Histórico médico</label>
      <textarea [value]="historicoMedico()" (input)="historicoMedico.set($any($event.target).value)" rows="3"
        class="input-field resize-none" placeholder="Observações médicas relevantes..."></textarea>
    </div>

    <!-- Actions -->
    <div class="flex gap-3 pt-2">
      <button type="button" (click)="cancelar()" class="flex-1 rounded-xl border border-[var(--color-border)] py-2.5 text-[var(--color-text-primary)] font-medium text-sm
                 hover:bg-[var(--color-surface-hover)] transition-colors cursor-pointer">
        Cancelar
      </button>
      <button type="submit" [disabled]="salvando()" class="flex-1 rounded-xl bg-primary py-2.5 text-white font-medium text-sm
                 hover:brightness-110 transition-all disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
        @if (salvando()) {
        <span class="flex items-center justify-center gap-2">
          <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin inline-block"></span>
          Salvando...
        </span>
        } @else {
        Salvar
        }
      </button>
    </div>
  </form>
  }
</div>
