<div class="form-page">
  <!-- Header -->
  <div class="form-header">
    <button (click)="cancelar()" aria-label="Voltar" class="form-back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        class="form-back-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
    </button>
    <h1 class="form-title">
      {{ modoEdicao() ? 'Editar Paciente' : 'Novo Paciente' }}
    </h1>
  </div>

  <!-- Loading -->
  @if (carregando()) {
  <div class="form-loading">
    <div class="form-spinner"></div>
  </div>
  }

  <!-- Form -->
  @if (!carregando()) {
  <form (submit)="$event.preventDefault(); salvar()" class="form-container">

    <!-- Error -->
    @if (erro()) {
    <div class="form-alert form-alert--error">
      <p>{{ erro() }}</p>
    </div>
    }

    <!-- Nome -->
    <div>
      <label class="form-label">Nome <span class="form-required">*</span></label>
      <input [value]="nome()" (input)="nome.set($any($event.target).value)" class="input-field"
        placeholder="Nome completo" />
    </div>

    <!-- CPF -->
    <div>
      <label class="form-label">CPF <span class="form-required">*</span></label>
      <input [value]="cpf()" (input)="cpf.set($any($event.target).value)" class="input-field"
        placeholder="000.000.000-00" />
    </div>

    <!-- Telefone -->
    <div>
      <label class="form-label">Telefone <span class="form-required">*</span></label>
      <input type="tel" [appTelefoneMask]="telefone()" (valorLimpo)="telefone.set($event)" class="input-field"
        placeholder="(00) 00000-0000" />
    </div>

    <!-- Email -->
    <div>
      <label class="form-label">E-mail</label>
      <input type="email" [value]="email()" (input)="email.set($any($event.target).value)" class="input-field"
        placeholder="email@exemplo.com" />
    </div>

    <!-- Data de nascimento -->
    <div>
      <label class="form-label">Data de nascimento</label>
      <input type="date"
        [value]="dataNascimento()"
        (input)="dataNascimento.set($any($event.target).value)"
        (blur)="validarDataNascimento()"
        [attr.max]="hoje"
        [attr.min]="dataMinima"
        class="input-field"
        [class.input-field--error]="erroDataNascimento()" />
      @if (erroDataNascimento()) {
        <p class="form-field-error">{{ erroDataNascimento() }}</p>
      }
    </div>

    <!-- Endereço -->
    <div>
      <label class="form-label">Endereço</label>
      <input [value]="endereco()" (input)="endereco.set($any($event.target).value)" class="input-field"
        placeholder="Rua, número, bairro..." />
    </div>

    <!-- Histórico médico -->
    <div>
      <label class="form-label">Histórico médico</label>
      <textarea [value]="historicoMedico()" (input)="historicoMedico.set($any($event.target).value)" rows="3"
        class="input-field resize-none" placeholder="Observações médicas relevantes..."></textarea>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" (click)="cancelar()" class="form-btn form-btn--cancel">
        Cancelar
      </button>
      <button type="submit" [disabled]="salvando() || !dataValida()" class="form-btn form-btn--submit">
        @if (salvando()) {
        <span class="form-btn-loading">
          <span class="form-btn-spinner"></span>
          Salvando...
        </span>
        } @else {
        Salvar
        }
      </button>
    </div>
  </form>
  }
</div>
