<nav
  class="fixed bottom-0 inset-x-0 z-50 border-t border-slate-700/50 bg-slate-900/95 backdrop-blur-md
            lg:inset-x-auto lg:top-0 lg:left-0 lg:bottom-0 lg:w-56 lg:border-t-0 lg:border-r lg:border-slate-700/50 lg:bg-slate-900 lg:flex lg:flex-col">

  <!-- Branding (desktop only) -->
  <div class="hidden lg:flex items-center gap-1 px-5 py-5 mb-2">
    <img src="/logo.png" alt="Gestão Fisio Logo" class="w-8 h-8 object-contain" />
    <span class="text-lg font-bold text-primary">Gestão</span><span class="text-lg font-bold text-accent">Fisio</span>
  </div>

  <!-- Nav links -->
  <div class="flex justify-around py-1
              lg:flex-col lg:gap-1 lg:px-3 lg:py-0 lg:justify-start lg:flex-1 lg:pb-0">

    <!-- Agenda -->
    <a routerLink="/agenda" routerLinkActive="nav-active" class="nav-link">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        class="nav-icon">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
      </svg>
      <span class="nav-label">Agenda</span>
    </a>

    <!-- Pacientes -->
    <a routerLink="/pacientes" routerLinkActive="nav-active" class="nav-link">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        class="nav-icon">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
      </svg>
      <span class="nav-label">Pacientes</span>
    </a>

    <!-- Clínicas -->
    <a routerLink="/clinicas" routerLinkActive="nav-active" class="nav-link">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        class="nav-icon">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008Zm0 3h.008v.008h-.008v-.008Zm0 3h.008v.008h-.008v-.008Z" />
      </svg>
      <span class="nav-label">Clínicas</span>
    </a>

    <!-- Financeiro -->
    <a routerLink="/financeiro" routerLinkActive="nav-active" class="nav-link">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        class="nav-icon">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
      <span class="nav-label">Financeiro</span>
    </a>

    <!-- Sair (mobile only — no desktop it's in the footer below) -->
    <button (click)="logout()" class="nav-link text-left lg:hidden hover:text-red-400 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="nav-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
      </svg>
      <span class="nav-label">Sair</span>
    </button>

  </div>

  <!-- Profile + Logout (desktop only) -->
  <div class="hidden lg:flex lg:flex-col lg:px-3 lg:pb-4 lg:gap-1 lg:border-t lg:border-[var(--color-border)] lg:pt-3">

    <!-- Profile card -->
    @if (perfilService.perfil(); as perfil) {
    <a routerLink="/perfil" class="profile-card">
      <div class="profile-avatar">
        @if (perfil.foto) {
        <img [src]="perfil.foto" alt="Foto de perfil" class="profile-avatar-img" />
        } @else {
        <span class="profile-initials">{{ perfilService.iniciais() }}</span>
        }
      </div>
      <div class="profile-info">
        <span class="profile-name">{{ perfilService.nomeExibicao() }}</span>
        <span class="profile-subtitle">
          {{ clinicasCount() ?? '–' }} clínicas · CREFITO {{ perfil.crefito }}
        </span>
      </div>
    </a>
    }

    <!-- Sair (desktop) -->
    <button (click)="logout()" class="nav-link text-left hover:text-red-400 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="nav-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
      </svg>
      <span class="nav-label">Sair</span>
    </button>

  </div>
</nav>
